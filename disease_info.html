<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Animated Background */
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Bubble Animation */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rise 15s infinite ease-in;
        }

        .bubble:nth-child(1) {
            width: 20px;
            height: 20px;
            left: 10%;
            animation-duration: 12s;
        }

        .bubble:nth-child(2) {
            width: 60px;
            height: 60px;
            left: 20%;
            animation-duration: 18s;
        }

        .bubble:nth-child(3) {
            width: 30px;
            height: 30px;
            left: 30%;
            animation-duration: 10s;
        }

        .bubble:nth-child(4) {
            width: 50px;
            height: 50px;
            left: 40%;
            animation-duration: 20s;
        }

        .bubble:nth-child(5) {
            width: 25px;
            height: 25px;
            left: 50%;
            animation-duration: 14s;
        }

        .bubble:nth-child(6) {
            width: 70px;
            height: 70px;
            left: 60%;
            animation-duration: 22s;
        }

        .bubble:nth-child(7) {
            width: 35px;
            height: 35px;
            left: 70%;
            animation-duration: 16s;
        }

        .bubble:nth-child(8) {
            width: 45px;
            height: 45px;
            left: 80%;
            animation-duration: 19s;
        }

        .bubble:nth-child(9) {
            width: 55px;
            height: 55px;
            left: 90%;
            animation-duration: 21s;
        }

        @keyframes rise {
            0% {
                bottom: -100px;
                transform: translateX(0);
            }
            50% {
                transform: translateX(100px);
            }
            100% {
                bottom: 100vh;
                transform: translateX(-50px);
            }
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin: 20px 0;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        header h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Search Section */
        .search-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .search-container {
            display: flex;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        #search-input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        #search-button {
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        #search-button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        /* Diseases Grid */
        .diseases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }

        .disease-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .disease-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.5);
        }

        .disease-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            position: relative;
            padding-bottom: 10px;
        }

        .disease-card h3::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background: #4CAF50;
            border-radius: 3px;
        }

        .disease-card p {
            margin-bottom: 15px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .symptoms, .prevention, .treatment {
            margin: 15px 0;
        }

        .symptoms h4, .prevention h4, .treatment h4 {
            margin-bottom: 8px;
            color: #FFD700;
        }

        .symptoms ul, .prevention ul, .treatment ul {
            list-style: none;
            padding-left: 10px;
        }

        .symptoms li, .prevention li, .treatment li {
            margin: 5px 0;
            position: relative;
            padding-left: 20px;
        }

        .symptoms li::before, .prevention li::before, .treatment li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #4CAF50;
            font-size: 1.2rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            color: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .modal-header h2 {
            font-size: 2rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            color: #FF6B6B;
            transform: rotate(90deg);
        }

        .modal-section {
            margin: 20px 0;
        }

        .modal-section h3 {
            color: #FFD700;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .modal-section p, .modal-section ul {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            text-align: center;
            color: white;
            padding: 30px 0;
            margin-top: 40px;
            font-size: 1rem;
            opacity: 0.8;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            #search-button {
                width: 100%;
            }
            
            .modal-content {
                width: 95%;
                padding: 20px;
            }
        }

        /* Animation for cards */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .disease-card {
            animation: fadeInUp 0.6s ease forwards;
        }

        .disease-card:nth-child(1) { animation-delay: 0.1s; }
        .disease-card:nth-child(2) { animation-delay: 0.2s; }
        .disease-card:nth-child(3) { animation-delay: 0.3s; }
        .disease-card:nth-child(4) { animation-delay: 0.4s; }
        .disease-card:nth-child(5) { animation-delay: 0.5s; }
        .disease-card:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <div class="bubbles" id="bubbles"></div>
    
    <div class="container">
        <header>
            <h1><i class="fas fa-heartbeat"></i> MediHealth</h1>
            <p>Comprehensive information about various diseases, symptoms, prevention, and treatments</p>
        </header>

        <div class="search-section">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for a disease...">
                <button id="search-button"><i class="fas fa-search"></i> Search</button>
            </div>
        </div>

        <div class="diseases-grid" id="diseases-grid">
            <!-- Disease cards will be generated by JavaScript -->
        </div>

        <div class="modal" id="disease-modal">
            <div class="modal-content" id="modal-content">
                <!-- Modal content will be generated by JavaScript -->
            </div>
        </div>

        <!-- <footer>
            <p>© 2025 MediHealth - Comprehensive Disease Information Portal | For educational purposes only</p>
            <p>This information is not a substitute for professional medical advice.</p>
        </footer> -->
    </div>

    <script>
        // Disease data
        const diseases = [
            {
                id: 1,
                name: "Diabetes",
                description: "A chronic condition that affects how your body turns food into energy.",
                symptoms: [
                    "Increased thirst and urination",
                    "Extreme hunger",
                    "Unexplained weight loss",
                    "Fatigue",
                    "Blurred vision"
                ],
                prevention: [
                    "Maintain a healthy weight",
                    "Exercise regularly",
                    "Eat a balanced diet",
                    "Avoid smoking",
                    "Regular health check-ups"
                ],
                treatment: [
                    "Insulin therapy",
                    "Oral medications",
                    "Blood sugar monitoring",
                    "Diet and exercise management",
                    "Regular medical care"
                ]
            },
            {
                id: 2,
                name: "Hypertension",
                description: "High blood pressure that can lead to serious health problems if left untreated.",
                symptoms: [
                    "Often asymptomatic",
                    "Headaches",
                    "Shortness of breath",
                    "Nosebleeds",
                    "Dizziness"
                ],
                prevention: [
                    "Reduce sodium intake",
                    "Exercise regularly",
                    "Limit alcohol consumption",
                    "Manage stress",
                    "Maintain healthy weight"
                ],
                treatment: [
                    "Medications (ACE inhibitors, diuretics)",
                    "Lifestyle modifications",
                    "Regular blood pressure monitoring",
                    "Dietary changes (DASH diet)",
                    "Stress management"
                ]
            },
            {
                id: 3,
                name: "Asthma",
                description: "A condition in which your airways narrow and swell and may produce extra mucus.",
                symptoms: [
                    "Shortness of breath",
                    "Chest tightness or pain",
                    "Wheezing when exhaling",
                    "Coughing attacks",
                    "Trouble sleeping"
                ],
                prevention: [
                    "Avoid triggers (allergens, smoke)",
                    "Take prescribed medications",
                    "Get vaccinated",
                    "Monitor breathing",
                    "Create an action plan"
                ],
                treatment: [
                    "Inhalers (bronchodilators)",
                    "Corticosteroids",
                    "Leukotriene modifiers",
                    "Allergy medications",
                    "Emergency treatment for attacks"
                ]
            },
            {
                id: 4,
                name: "Arthritis",
                description: "Inflammation of one or more joints, causing pain and stiffness.",
                symptoms: [
                    "Joint pain and stiffness",
                    "Swelling around joints",
                    "Decreased range of motion",
                    "Redness and warmth",
                    "Fatigue"
                ],
                prevention: [
                    "Maintain healthy weight",
                    "Exercise regularly",
                    "Protect joints from injury",
                    "Eat anti-inflammatory foods",
                    "Avoid repetitive movements"
                ],
                treatment: [
                    "Pain relievers and anti-inflammatories",
                    "Physical therapy",
                    "Joint protection techniques",
                    "Surgery (in severe cases)",
                    "Lifestyle modifications"
                ]
            },
            {
                id: 5,
                name: "Depression",
                description: "A mood disorder causing persistent feelings of sadness and loss of interest.",
                symptoms: [
                    "Persistent sad mood",
                    "Loss of interest in activities",
                    "Changes in appetite/weight",
                    "Sleep disturbances",
                    "Fatigue or loss of energy"
                ],
                prevention: [
                    "Regular exercise",
                    "Healthy diet",
                    "Adequate sleep",
                    "Stress management",
                    "Social connections"
                ],
                treatment: [
                    "Psychotherapy (CBT)",
                    "Antidepressant medications",
                    "Lifestyle changes",
                    "Support groups",
                    "Mindfulness practices"
                ]
            },
            {
                id: 6,
                name: "Cancer",
                description: "Diseases involving abnormal cell growth with the potential to invade or spread.",
                symptoms: [
                    "Unexplained weight loss",
                    "Persistent fatigue",
                    "Lumps or thickening",
                    "Changes in skin",
                    "Unusual bleeding"
                ],
                prevention: [
                    "Avoid tobacco",
                    "Healthy diet",
                    "Regular exercise",
                    "Sun protection",
                    "Regular screenings"
                ],
                treatment: [
                    "Surgery",
                    "Chemotherapy",
                    "Radiation therapy",
                    "Immunotherapy",
                    "Targeted therapy"
                ]
            }
        ];

        // Create bubble animation
        function createBubbles() {
            const bubblesContainer = document.getElementById('bubbles');
            const bubbleCount = 15;
            
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDuration = (10 + Math.random() * 20) + 's';
                bubble.style.animationDelay = Math.random() * 5 + 's';
                bubblesContainer.appendChild(bubble);
            }
        }

        // Generate disease cards
        function generateDiseaseCards() {
            const diseasesGrid = document.getElementById('diseases-grid');
            diseasesGrid.innerHTML = '';
            
            diseases.forEach(disease => {
                const card = document.createElement('div');
                card.className = 'disease-card';
                card.innerHTML = `
                    <h3>${disease.name}</h3>
                    <p>${disease.description}</p>
                    <div class="symptoms">
                        <h4>Symptoms:</h4>
                        <ul>
                            ${disease.symptoms.slice(0, 3).map(symptom => `<li>${symptom}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="prevention">
                        <h4>Prevention:</h4>
                        <ul>
                            ${disease.prevention.slice(0, 3).map(prevent => `<li>${prevent}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="treatment">
                        <h4>Treatment:</h4>
                        <ul>
                            ${disease.treatment.slice(0, 3).map(treat => `<li>${treat}</li>`).join('')}
                        </ul>
                    </div>
                `;
                
                card.addEventListener('click', () => openDiseaseModal(disease));
                diseasesGrid.appendChild(card);
            });
        }

        // Open disease modal
        function openDiseaseModal(disease) {
            const modal = document.getElementById('disease-modal');
            const modalContent = document.getElementById('modal-content');
            
            modalContent.innerHTML = `
                <div class="modal-header">
                    <h2>${disease.name}</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-section">
                    <p>${disease.description}</p>
                </div>
                <div class="modal-section">
                    <h3>Symptoms</h3>
                    <ul>
                        ${disease.symptoms.map(symptom => `<li>${symptom}</li>`).join('')}
                    </ul>
                </div>
                <div class="modal-section">
                    <h3>Prevention</h3>
                    <ul>
                        ${disease.prevention.map(prevent => `<li>${prevent}</li>`).join('')}
                    </ul>
                </div>
                <div class="modal-section">
                    <h3>Treatment</h3>
                    <ul>
                        ${disease.treatment.map(treat => `<li>${treat}</li>`).join('')}
                    </ul>
                </div>
            `;
            
            modal.style.display = 'flex';
            
            // Close modal
            document.querySelector('.close-modal').addEventListener('click', () => {
                modal.style.display = 'none';
            });
            
            // Close modal when clicking outside
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        }

        // Search functionality
        function setupSearch() {
            const searchInput = document.getElementById('search-input');
            const searchButton = document.getElementById('search-button');
            
            function filterDiseases() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                const diseasesGrid = document.getElementById('diseases-grid');
                diseasesGrid.innerHTML = '';
                
                const filteredDiseases = searchTerm 
                    ? diseases.filter(disease => 
                        disease.name.toLowerCase().includes(searchTerm) ||
                        disease.description.toLowerCase().includes(searchTerm) ||
                        disease.symptoms.some(symptom => symptom.toLowerCase().includes(searchTerm)) ||
                        disease.prevention.some(prevent => prevent.toLowerCase().includes(searchTerm)) ||
                        disease.treatment.some(treat => treat.toLowerCase().includes(searchTerm))
                    )
                    : diseases;
                
                if (filteredDiseases.length === 0) {
                    diseasesGrid.innerHTML = '<div class="disease-card" style="grid-column: 1/-1; text-align: center;"><h3>No diseases found</h3><p>Try searching for something else.</p></div>';
                } else {
                    filteredDiseases.forEach(disease => {
                        const card = document.createElement('div');
                        card.className = 'disease-card';
                        card.innerHTML = `
                            <h3>${disease.name}</h3>
                            <p>${disease.description}</p>
                            <div class="symptoms">
                                <h4>Symptoms:</h4>
                                <ul>
                                    ${disease.symptoms.slice(0, 3).map(symptom => `<li>${symptom}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="prevention">
                                <h4>Prevention:</h4>
                                <ul>
                                    ${disease.prevention.slice(0, 3).map(prevent => `<li>${prevent}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="treatment">
                                <h4>Treatment:</h4>
                                <ul>
                                    ${disease.treatment.slice(0, 3).map(treat => `<li>${treat}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                        
                        card.addEventListener('click', () => openDiseaseModal(disease));
                        diseasesGrid.appendChild(card);
                    });
                }
            }
            
            searchButton.addEventListener('click', filterDiseases);
            searchInput.addEventListener('input', filterDiseases);
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            createBubbles();
            generateDiseaseCards();
            setupSearch();
        });
    </script>
</body>
</html>
